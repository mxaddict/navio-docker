## i2pd configuration for the navio-docker `i2p` image.
##
## i2pd runs next to naviod in the same container and only serves naviod's
## SAM connection, so every client-facing service except SAM is disabled and
## SAM listens on loopback only. Replace this file by mounting your own at
## /etc/i2pd/i2pd.conf. See
## https://i2pd.readthedocs.io/en/latest/user-guide/configuration/

log = stdout
loglevel = warn

ipv4 = true
ipv6 = false

## Fixed router port (NTCP2 TCP and SSU2 UDP), so it can be published with
## `-p 48480:48480/tcp -p 48480:48480/udp`. Unpublished, i2pd still works,
## but as a firewalled router with slower tunnel builds.
port = 48480

[ntcp2]
enabled = true
published = true

[ssu2]
enabled = true
published = true

[sam]
## naviod is started with -i2psam=127.0.0.1:7656 by the entrypoint.
enabled = true
address = 127.0.0.1
port = 7656

[http]
enabled = false

[httpproxy]
enabled = false

[socksproxy]
enabled = false

[upnp]
enabled = false

[reseed]
verify = true
