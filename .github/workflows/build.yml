name: docker

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]
    workflow_dispatch:
    # Instant trigger: send a navio-core-release event to build immediately.
    #   gh api repos/nav-io/navio-docker/dispatches \
    #       -f event_type=navio-core-release
    repository_dispatch:
        types: [navio-core-release]
    schedule:
        # Poll every 6h; the build is skipped unless the release version changed.
        - cron: '0 */6 * * *'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write # create the built/<version> sentinel tag
    actions: write # cancel the run when publish secrets are missing

env:
    # Docker Hub repository to publish to.
    IMAGE_NAME: navio/navio

jobs:
    # Resolve the version, decide whether this run builds at all, and gate
    # publishing on the Docker Hub secrets — once, for every image variant.
    prepare:
        runs-on: ubuntu-latest
        outputs:
            navio: ${{ steps.ver.outputs.navio }}
            build: ${{ steps.decide.outputs.build }}
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Resolve navio-core release version
              id: ver
              run: |
                  # The version that the Dockerfile will bundle (newest release
                  # that ships binaries). Tag the image with it, sans leading "v".
                  tag="$(curl -fsSL \
                      https://api.github.com/repos/nav-io/navio-core/releases?per_page=30 \
                      | tr -d '\000-\037' \
                      | jq -r 'map(select(any(.assets[]?; .name | endswith("x86_64-linux-gnu.tar.gz")))) | .[0].tag_name')"
                  echo "navio=${tag#v}" >> "$GITHUB_OUTPUT"
                  echo "resolved navio version: ${tag#v}"

            - name: Decide whether to build
              id: decide
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ver='${{ steps.ver.outputs.navio }}'
                  case "${{ github.event_name }}" in
                      schedule | repository_dispatch)
                          # Only build when this release has not been built yet.
                          if gh api "repos/${{ github.repository }}/git/ref/tags/built/${ver}" >/dev/null 2>&1; then
                              echo "navio ${ver} already built — skipping"
                              echo "build=false" >> "$GITHUB_OUTPUT"
                          else
                              echo "new navio release ${ver} — building"
                              echo "build=true" >> "$GITHUB_OUTPUT"
                          fi
                          ;;
                      *)
                          # push / pull_request / manual always build (test).
                          echo "build=true" >> "$GITHUB_OUTPUT"
                          ;;
                  esac

            # Publishing requires Docker Hub credentials. When they are absent,
            # cancel the run (it ends as "cancelled", not "failed") instead of
            # building an image that can never be pushed. PR/test builds never
            # publish, so they skip this gate.
            - name: Require Docker Hub secrets to publish
              if: steps.decide.outputs.build == 'true' && github.event_name != 'pull_request'
              env:
                  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
                  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
                      echo "Docker Hub secrets present — proceeding to publish"
                      exit 0
                  fi
                  echo "::warning::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set — cancelling run"
                  gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/cancel"
                  # Block here so later publish steps never start before the
                  # cancellation lands; fail closed if it somehow doesn't.
                  for _ in $(seq 1 30); do sleep 10; done
                  exit 1

    build:
        needs: prepare
        if: needs.prepare.outputs.build == 'true'
        runs-on: ubuntu-latest
        strategy:
            # One failed variant cancels the rest; finalize then skips, so the
            # release is not marked built and the next poll retries it.
            fail-fast: true
            matrix:
                include:
                    - target: node
                      suffix: ''
                    - target: i2p
                      suffix: -i2p
                    - target: tor
                      suffix: -tor
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            # Every variant gets the same tags, suffixed for non-default
            # targets: <version>-i2p, latest-tor, …
            - name: Docker metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.IMAGE_NAME }}
                  flavor: |
                      suffix=${{ matrix.suffix }}
                  tags: |
                      type=raw,value=${{ needs.prepare.outputs.navio }}
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=ref,event=pr
                      type=sha

            - name: Log in to Docker Hub
              if: github.event_name != 'pull_request'
              uses: docker/login-action@v4
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  target: ${{ matrix.target }}
                  platforms: linux/amd64,linux/arm64
                  # Publish on every non-PR event; PRs build for verification only.
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  annotations: ${{ steps.meta.outputs.annotations }}
                  # One cache scope per target so the parallel builds don't
                  # overwrite each other's cache manifest.
                  cache-from: type=gha,scope=${{ matrix.target }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.target }}
                  # TODO(deploy): supply-chain attestations for published images.
                  # provenance: true
                  # sbom: true

    # Runs only once every variant has been pushed.
    finalize:
        needs: [prepare, build]
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Sync Docker Hub description
              uses: peter-evans/dockerhub-description@v5
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}
                  repository: ${{ env.IMAGE_NAME }}
                  short-description: 'Thin Navio full-node image built from official release binaries'

            - name: Record built release
              # Mark this release as built so scheduled/dispatch polls skip it.
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  ver='${{ needs.prepare.outputs.navio }}'
                  gh api -X POST "repos/${{ github.repository }}/git/refs"                       -f ref="refs/tags/built/${ver}"                       -f sha="${{ github.sha }}"                       && echo "tagged built/${ver}"                       || echo "built/${ver} already exists — nothing to do"
